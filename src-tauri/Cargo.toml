[package]
name = "vanguard"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "HTTP/HTTPS traffic inspector for crawler engineering"
default-run = "vanguard"

[lib]
name = "vanguard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"

hudsucker = { version = "0.25", features = ["decoder", "rcgen-ca", "rustls-client", "http2"] }
rcgen = { version = "0.14", features = ["x509-parser", "pem"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "http2", "charset", "json", "gzip", "brotli", "deflate", "zstd", "cookies", "stream"] }

tokio = { version = "1", features = ["full"] }
futures = "0.3"
bytes = "1"
http = "1"
http-body-util = "0.1"

rusqlite = { version = "0.40", features = ["bundled", "chrono", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
percent-encoding = "2"
base64 = "0.22"
regex = "1"
sha2 = "0.10"
time = "0.3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
dirs = "6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
